[package]
name = "powerup-poker-rust-engine"
version = "0.1.0"
edition = "2024"
description = "Rust engine for Powerup Poker, a game of wits and luck."

[dependencies]
clap = { version = "4.6.8", features = ["derive"] }
itertools = "0.15.0"
pyo3 = { version = "0.30.1", features = ["extension-module"], optional = true }
rand = "0.10.4"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
strum = { version = "0.28.0", features = ["derive"] }

[features]
pyo3 = ["dep:pyo3"]
python = ["dep:pyo3"]

[lib]
name = "powerup_poker_rust_engine"
crate-type = ["cdylib", "rlib"]
